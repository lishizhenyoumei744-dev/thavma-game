<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Θαύμα ― 世界の外側にある物語 ―</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:#030003;
  color:#fff;
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
}

body{
  overflow-x:hidden;
}

button{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:1px solid #7d1725;
  border-radius:12px;
  background:
    linear-gradient(135deg,#16050a,#390912,#160307);
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 0 0 transparent;
}

button:hover{
  transform:translateY(-3px) scale(1.01);
  border-color:#ff314c;
  box-shadow:
    0 0 12px #ff173844,
    0 0 35px #ff173822;
}

button:active{
  transform:scale(.97);
}

.container{
  max-width:950px;
  margin:auto;
  padding:18px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.title-screen{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#480812 0%,#160308 28%,#050006 65%,#000 100%);
}

.title-screen.active{
  display:flex;
}

/* =========================
   TITLE ANIMATION
========================= */

.title-bg{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.red-glow{
  position:absolute;
  width:60vw;
  height:60vw;
  max-width:800px;
  max-height:800px;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(
    circle,
    #ff102522 0%,
    #b0001820 25%,
    transparent 70%
  );
  animation:redPulse 4s ease-in-out infinite;
}

@keyframes redPulse{
  0%,100%{
    transform:translate(-50%,-50%) scale(.9);
    opacity:.55;
  }
  50%{
    transform:translate(-50%,-50%) scale(1.12);
    opacity:1;
  }
}

/* 赤い円 */
.ring{
  position:absolute;
  left:50%;
  top:50%;
  border:1px solid #ff183855;
  border-radius:50%;
  transform:translate(-50%,-50%);
  animation:ringMove 7s linear infinite;
}

.ring:nth-child(1){
  width:350px;
  height:350px;
}

.ring:nth-child(2){
  width:520px;
  height:520px;
  animation-duration:11s;
  animation-direction:reverse;
}

.ring:nth-child(3){
  width:750px;
  height:750px;
  animation-duration:16s;
}

@keyframes ringMove{
  from{
    transform:translate(-50%,-50%) rotate(0deg) scale(.9);
    opacity:.15;
  }
  50%{
    opacity:.7;
  }
  to{
    transform:translate(-50%,-50%) rotate(360deg) scale(1.1);
    opacity:.05;
  }
}

/* 浮遊粒子 */
.particles{
  position:absolute;
  inset:0;
}

.particle{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#ff334d;
  box-shadow:0 0 10px #ff1838;
  animation:floatParticle linear infinite;
}

@keyframes floatParticle{
  from{
    transform:translateY(110vh) translateX(0) scale(.5);
    opacity:0;
  }
  15%{
    opacity:1;
  }
  85%{
    opacity:.8;
  }
  to{
    transform:translateY(-15vh) translateX(80px) scale(1.5);
    opacity:0;
  }
}

/* 横切る赤い光 */
.scan-line{
  position:absolute;
  width:120%;
  height:2px;
  left:-10%;
  top:-10%;
  background:linear-gradient(
    90deg,
    transparent,
    #ff243f,
    #ff8895,
    #ff243f,
    transparent
  );
  box-shadow:0 0 20px #ff1938;
  opacity:.45;
  animation:scan 5s linear infinite;
}

@keyframes scan{
  from{
    top:-10%;
  }
  to{
    top:110%;
  }
}

/* 霧 */
.mist{
  position:absolute;
  width:120%;
  height:35%;
  left:-10%;
  bottom:-10%;
  background:linear-gradient(
    90deg,
    transparent,
    #8f001622,
    #ff002233,
    #8f001622,
    transparent
  );
  filter:blur(25px);
  animation:mistMove 8s ease-in-out infinite alternate;
}

@keyframes mistMove{
  from{
    transform:translateX(-8%) scaleY(.8);
  }
  to{
    transform:translateX(8%) scaleY(1.2);
  }
}

.title-core{
  position:relative;
  z-index:5;
  text-align:center;
  width:min(850px,95vw);
  animation:titleAppear 1.8s ease-out;
}

@keyframes titleAppear{
  from{
    opacity:0;
    transform:scale(1.15);
    filter:blur(15px);
  }
  to{
    opacity:1;
    transform:scale(1);
    filter:blur(0);
  }
}

.title-core h1{
  margin:0;
  font-size:clamp(65px,15vw,145px);
  letter-spacing:18px;
  color:#fff;
  text-shadow:
    0 0 5px #fff,
    0 0 15px #ff334d,
    0 0 35px #ff102f,
    0 0 75px #b0001d;
  animation:
    titlePulse 3s ease-in-out infinite,
    titleFlicker 7s infinite;
}

@keyframes titlePulse{
  0%,100%{
    transform:scale(1);
    text-shadow:
      0 0 5px #fff,
      0 0 15px #ff334d,
      0 0 35px #ff102f;
  }
  50%{
    transform:scale(1.035);
    text-shadow:
      0 0 7px #fff,
      0 0 25px #ff334d,
      0 0 60px #ff102f,
      0 0 100px #97001b;
  }
}

@keyframes titleFlicker{
  0%,92%,94%,96%,100%{
    opacity:1;
  }
  93%,95%{
    opacity:.65;
  }
}

.subtitle{
  color:#dca8ae;
  letter-spacing:8px;
  margin:10px 0 42px;
  font-size:clamp(12px,2.5vw,18px);
  text-shadow:0 0 12px #ff1c3a;
  animation:subtitleFloat 4s ease-in-out infinite;
}

@keyframes subtitleFloat{
  0%,100%{
    transform:translateY(0);
    opacity:.75;
  }
  50%{
    transform:translateY(-5px);
    opacity:1;
  }
}

.enter{
  width:min(360px,90vw);
  margin:auto;
}

.enter button{
  position:relative;
  overflow:hidden;
  border-color:#a51b2d;
  background:
    linear-gradient(
      90deg,
      #100207,
      #3b0710,
      #100207
    );
}

.enter button::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:60%;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent,
    #ff526766,
    transparent
  );
  transform:skewX(-20deg);
  animation:buttonLight 3.5s infinite;
}

@keyframes buttonLight{
  from{
    left:-100%;
  }
  to{
    left:150%;
  }
}

/* =========================
   GAME UI
========================= */

.panel{
  background:
    linear-gradient(145deg,#10050aee,#1d070dee);
  border:1px solid #4b1622;
  border-radius:16px;
  padding:18px;
  margin:12px 0;

.menu-grid{

  gap:9px;

.gold{

.cyan{
  color:#79eaff;
}

.blood{

}

.flame{
  color:#ff8a8a;
}

.muted{

}

.character-list{
  display:grid;

  gap:12px;

.character-card{
  background:#0d0509;
  border:1px solid #4a1722;
  border-radius:15px;
  padding:14px;
  cursor:pointer;
  transition:.25s;
}

.character-card:hover{

  border-color:#ff304b;
  box-shadow:0 0 30px #ff173822;
}

.character-icon{
  height:180px;
  border-radius:12px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
  background:
    radial-gradient(circle,#55101d,#080207 70%);

  box-shadow:inset 0 0 30px #ff001015;
}

.slime-icon{

}

.flame-icon{
  background:
    radial-gradient(circle,#5b1118,#080207 70%);
  border-color:#ff455c;
}

.profile{

  line-height:1.7;
}

.skill-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.skill-item{
  padding:14px;
  background:#12070c;
  border:1px solid #4b1824;
  border-radius:12px;
}

.hp{
  height:20px;
  background:#29232a;
  border-radius:10px;
  overflow:hidden;
  margin:6px 0 15px;
}

.hp-inner{
  height:100%;
  background:linear-gradient(90deg,#8e1528,#ff536b,#ffb0b8);
  transition:.3s;
}

.log{
  min-height:90px;
  max-height:250px;
  overflow:auto;
  background:#030003;
  border:1px solid #33101a;
  border-radius:12px;
  padding:12px;
  line-height:1.7;

.equip{

  justify-content:space-between;

  background:#12070c;
  border-radius:10px;
  padding:10px;
  margin:7px 0;
}

.equip button{
  width:auto;
  margin:0;
}

@media(max-width:650px){
  .menu-grid,
  .skill-grid,
  .character-list{
    grid-template-columns:1fr;
  }

  .character-icon{
    height:150px;
  }
}
</style>
</head>

<script>

/* =========================
   TITLE PARTICLES
========================= */

function createParticles(){

  const container =
    document.getElementById("particles");

  if(!container)return;

  container.innerHTML="";

  for(let i=0;i<55;i++){

    const particle =
      document.createElement("div");

    particle.className="particle";

    particle.style.left =
      Math.random()*100+"%";

    particle.style.animationDuration =
      (5+Math.random()*9)+"s";

    particle.style.animationDelay =
      (-Math.random()*10)+"s";

    particle.style.opacity =
      .2+Math.random()*.8;

    particle.style.transform =
      `scale(${.5+Math.random()*1.5})`;

    container.appendChild(particle);

  }

}

createParticles();


/* =========================
   GAME DATA
========================= */

let gameData={
  gems:300,
  character:"旅人",
  bgm:true,
  se:true,
  equipped:[]
};

let currentEnemy=null;

let playerHP=1000;
let playerMaxHP=1000;

let enemyHP=0;
let enemyMaxHP=0;

let guarding=false;
let battleFinished=false;


/* =========================
   ENEMIES
========================= */

const enemies=[

  {
    id:"slime",
    name:"深淵スライム",
    hp:500,
    attack:45,
    reward:50
  },

  {
    id:"knight",
    name:"黒鉄の騎士",
    hp:1000,
    attack:75,
    reward:100
  },

  {
    id:"dragon",
    name:"終焉竜",
    hp:1800,
    attack:110,
    reward:200
  },

  {
    id:"boss",
    name:"世界の外側に立つ者",
    hp:3500,
    attack:145,
    reward:500
  }

];


/* =========================
   AUDIO
========================= */

let audioCtx=null;

let seGain=null;
let bgmGain=null;

let bgmTimer=null;

function initAudio(){

  if(audioCtx)return;

  audioCtx=
    new(window.AudioContext||window.webkitAudioContext)();

  seGain=audioCtx.createGain();
  bgmGain=audioCtx.createGain();

  seGain.gain.value=.07;
  bgmGain.gain.value=.025;

  seGain.connect(audioCtx.destination);
  bgmGain.connect(audioCtx.destination);

}


/* 効果音 */

function seTone(
  frequency,
  duration,
  type="sine",
  volume=.2
){

  if(!gameData.se)return;

  initAudio();

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type=type;

  osc.frequency.value=frequency;

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(seGain);

  osc.start();

  osc.stop(
    audioCtx.currentTime+duration
  );

}


/* 不気味なBGM */

function startBGM(){

  if(!gameData.bgm)return;

  initAudio();

  if(audioCtx.state==="suspended"){
    audioCtx.resume();
  }

  if(bgmTimer)return;

  /*
    暗いドローン系の音階
  */

  const notes=[
    55,
    58.27,
    65.41,
    49,
    51.91,
    55,
    41.20,
    46.25
  ];

  let i=0;

  bgmTimer=setInterval(()=>{

    if(!gameData.bgm)return;

    initAudio();

    const osc=
      audioCtx.createOscillator();

    const gain=
      audioCtx.createGain();

    osc.type="sawtooth";

    osc.frequency.setValueAtTime(
      notes[i%notes.length],
      audioCtx.currentTime
    );

    /*
      少しだけ音程を揺らす
    */

    osc.detune.setValueAtTime(
      Math.sin(i*.8)*8,
      audioCtx.currentTime
    );

    gain.gain.setValueAtTime(
      .001,
      audioCtx.currentTime
    );

    gain.gain.linearRampToValueAtTime(
      .035,
      audioCtx.currentTime+.15
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime+2.4
    );

    osc.connect(gain);
    gain.connect(bgmGain);

    osc.start();

    osc.stop(
      audioCtx.currentTime+2.5
    );

    i++;

  },1100);

}


function stopBGM(){

  clearInterval(bgmTimer);

  bgmTimer=null;

}


/* =========================
   SAVE
========================= */

function saveGame(){

  localStorage.setItem(
    "thavmaSave",
    JSON.stringify(gameData)
  );

}


function loadGameData(){

  const saved=
    localStorage.getItem("thavmaSave");

  if(saved){

    try{

      gameData=
        Object.assign(
          gameData,
          JSON.parse(saved)
        );

    }catch(e){}

  }

  updateGemDisplays();

  document.getElementById(
    "selectedCharacter"
  ).textContent=gameData.character;

  renderEquip();

  document.getElementById(
    "bgmState"
  ).textContent=
    gameData.bgm?"ON":"OFF";

  document.getElementById(
    "seState"
  ).textContent=
    gameData.se?"ON":"OFF";

}


function updateGemDisplays(){

  document.getElementById(
    "menuGems"
  ).textContent=gameData.gems;

  document.getElementById(
    "gachaGems"
  ).textContent=gameData.gems;

}


/* =========================
   SCREEN
========================= */

function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(screen=>{
      screen.classList.remove("active");
    });

  document
    .getElementById(id)
    .classList.add("active");

  updateGemDisplays();

  if(id==="challengeScreen"){
    renderEnemies();
  }

  if(id==="equipScreen"){
    renderEquip();
  }

  startBGM();

}


/* =========================
   NEW GAME
========================= */

function newGame(){

  gameData={
    gems:300,
    character:"旅人",
    bgm:true,
    se:true,
    equipped:[]
  };

  saveGame();
  loadGameData();

  initAudio();

  seTone(
    220,
    .35,
    "sine",
    .2
  );

  setTimeout(()=>{
    seTone(
      110,
      .6,
      "sawtooth",
      .12
    );
  },180);

  showScreen("menuScreen");

}


/* =========================
   LOAD GAME
========================= */

function loadGame(){

  loadGameData();

  initAudio();

  seTone(
    180,
    .25,
    "sine",
    .15
  );

  showScreen("menuScreen");

}


/* =========================
   ENEMY LIST
========================= */

function renderEnemies(){

  const list=
    document.getElementById("enemyList");

  list.innerHTML="";

  enemies.forEach(enemy=>{

    list.innerHTML+=`

      <div class="panel">

        <h3>${enemy.name}</h3>

        <p>
          HP：${enemy.hp}
        </p>

        <p>
          攻撃力：${enemy.attack}
        </p>

        <p class="gold">
          撃破報酬：
          💎 ${enemy.reward}石
        </p>

        <button
          onclick="startBattle('${enemy.id}')"
        >
          挑戦する
        </button>

      </div>

    `;

  });

}


/* =========================
   BATTLE START
========================= */

function startBattle(id){

  currentEnemy=
    enemies.find(enemy=>enemy.id===id);

  enemyMaxHP=
    currentEnemy.hp;

  enemyHP=
    currentEnemy.hp;

  playerMaxHP=1000;
  playerHP=1000;

  guarding=false;
  battleFinished=false;

  document.getElementById(
    "battleEnemyName"
  ).textContent=
    currentEnemy.name;

  document.getElementById(
    "battleLog"
  ).innerHTML=
    `⚔️ ${currentEnemy.name}が現れた！<br>`;

  createBattleSkills();

  updateBattleUI();

  seTone(
    75,
    .5,
    "sawtooth",
    .25
  );

  showScreen("battleScreen");

}


/* =========================
   BATTLE UI
========================= */

function updateBattleUI(){

  document.getElementById(
    "enemyHpBar"
  ).style.width=
    Math.max(
      0,
      enemyHP/enemyMaxHP*100
    )+"%";

  document.getElementById(
    "playerHpBar"
  ).style.width=
    Math.max(
      0,
      playerHP/playerMaxHP*100
    )+"%";

  document.getElementById(
    "enemyHpText"
  ).textContent=
    ` ${enemyHP} / ${enemyMaxHP}`;

  document.getElementById(
    "playerHpText"
  ).textContent=
    ` ${playerHP} / ${playerMaxHP}`;

}


/* =========================
   BATTLE LOG
========================= */

function battleLog(text){

  const log=
    document.getElementById("battleLog");

  log.innerHTML+=
    text+"<br>";

  log.scrollTop=
    log.scrollHeight;

}


/* =========================
   ATTACK
========================= */

function battleAttack(){

  if(battleFinished)return;

  const damage=
    Math.floor(
      90+Math.random()*31
    );

  enemyHP=
    Math.max(
      0,
      enemyHP-damage
    );

  battleLog(
    `⚔️ ${damage}ダメージを与えた！`
  );

  seTone(
    180,
    .12,
    "square",
    .18
  );

  updateBattleUI();

  if(enemyHP<=0){

    winBattle();

    return;

  }

  enemyTurn();

}


/* =========================
   GUARD
========================= */

function battleGuard(){

  if(battleFinished)return;

  guarding=true;

  battleLog(
    "🛡️ 防御態勢に入った！"
  );

  seTone(
    140,
    .18,
    "sine",
    .16
  );

  enemyTurn();

}


/* =========================
   SKILLS
========================= */

function createBattleSkills(){

  const container=
    document.getElementById(
      "battleSkillButtons"
    );

  container.innerHTML="";

  const skills=[
    {
      name:"星の閃光",
      damage:190
    },
    {
      name:"再生",
      heal:220
    }
  ];

  skills.forEach(skill=>{

    const button=
      document.createElement("button");

    button.textContent=
      skill.name;

    button.onclick=
      ()=>useSkill(skill);

    container.appendChild(button);

  });

}


function useSkill(skill){

  if(battleFinished)return;

  if(skill.damage){

    enemyHP=
      Math.max(
        0,
        enemyHP-skill.damage
      );

    battleLog(
      `✨ ${skill.name}！
      ${skill.damage}ダメージ！`
    );

    seTone(
      440,
      .3,
      "triangle",
      .2
    );

  }

  if(skill.heal){

    const before=
      playerHP;

    playerHP=
      Math.min(
        playerMaxHP,
        playerHP+skill.heal
      );

    const healed=
      playerHP-before;

    battleLog(
      `💚 ${skill.name}！
      HPが${healed}回復した！`
    );

    seTone(
      330,
      .35,
      "sine",
      .18
    );

  }

  updateBattleUI();

  if(enemyHP<=0){

    winBattle();

    return;

  }

  enemyTurn();

}


/* =========================
   ENEMY TURN
========================= */

function enemyTurn(){

  if(battleFinished)return;

  let damage=
    Math.floor(
      currentEnemy.attack*
      (.8+Math.random()*.4)
    );

  if(guarding){

    damage=
      Math.floor(damage*.5);

    battleLog(
      "🛡️ 防御でダメージ半減！"
    );

  }

  guarding=false;

  playerHP=
    Math.max(
      0,
      playerHP-damage
    );

  battleLog(
    `👿 ${currentEnemy.name}の攻撃！
    ${damage}ダメージ！`
  );

  seTone(
    65,
    .18,
    "sawtooth",
    .18
  );

  updateBattleUI();

  if(playerHP<=0){

    loseBattle();

  }

}


/* =========================
   WIN
========================= */

function winBattle(){

  if(battleFinished)return;

  battleFinished=true;

  const reward=
    currentEnemy.reward;

  gameData.gems+=reward;

  saveGame();

  updateGemDisplays();

  battleLog("");

  battleLog(
    `🎉 ${currentEnemy.name}を倒した！`
  );

  battleLog(
    `💎 ${reward}石を獲得！`
  );

  battleLog(
    `現在の所持石：${gameData.gems}石`
  );

  seTone(
    440,
    .2,
    "triangle",
    .2
  );

  setTimeout(()=>{
    seTone(
      660,
      .3,
      "triangle",
      .18
    );
  },130);

  document.getElementById(
    "battleSkillButtons"
  ).innerHTML=`

    <button
      onclick="showScreen('challengeScreen')"
    >
      挑戦画面へ戻る
    </button>

    <button
      onclick="startBattle('${currentEnemy.id}')"
    >
      もう一度挑戦する
    </button>

  `;

}


/* =========================
   LOSE
========================= */

function loseBattle(){

  if(battleFinished)return;

  battleFinished=true;

  battleLog(
    "💀 戦闘に敗北した……"
  );

  document.getElementById(
    "battleSkillButtons"
  ).innerHTML=`

    <button
      onclick="showScreen('challengeScreen')"
    >
      挑戦画面へ戻る
    </button>

    <button
      onclick="startBattle('${currentEnemy.id}')"
    >
      もう一度挑戦する
    </button>

  `;

  seTone(
    45,
    .7,
    "sawtooth",
    .2
  );

}


/* =========================
   GACHA
========================= */

function gacha(count){

  const cost=
    count*300;

  if(gameData.gems<cost){

    document.getElementById(
      "gachaResult"
    ).textContent=
      "💎 石が足りません。";

    seTone(
      70,
      .2
    );

    return;

  }

  gameData.gems-=cost;

  const skills=[
    "斬撃",
    "星の閃光",
    "再生",
    "完全適応"
  ];

  let result="";

  for(let i=0;i<count;i++){

    const skill=
      skills[
        Math.floor(
          Math.random()*skills.length
        )
      ];

    result+=
      `✨ ${skill}<br>`;

  }

  document.getElementById(
    "gachaResult"
  ).innerHTML=
    `<h3>ガチャ結果</h3>${result}`;

  saveGame();

  updateGemDisplays();

  seTone(
    330,
    .2,
    "triangle",
    .15
  );

  setTimeout(()=>{
    seTone(
      550,
      .25,
      "triangle",
      .12
    );
  },180);

}


/* =========================
   EQUIPMENT
========================= */

function renderEquip(){

  const box=
    document.getElementById("equipList");

  if(!box)return;

  const skills=[
    "斬撃",
    "星の閃光",
    "再生",
    "完全適応"
  ];

  box.innerHTML=
    skills.map(skill=>`

      <div class="equip">

        <span>
          ${
            gameData.equipped.includes(skill)
            ?"✅ "
            :""
          }

          ${skill}

        </span>

        <button
          onclick="equipSkill('${skill}')"
        >
          ${
            gameData.equipped.includes(skill)
            ?"外す"
            :"装備"
          }
        </button>

      </div>

    `).join("");

  document.getElementById(
    "equipStatus"
  ).textContent=
    "装備中："+
    (
      gameData.equipped.length
      ?gameData.equipped.join(" / ")
      :"なし"
    );

}


function equipSkill(skill){

  const list=
    gameData.equipped;

  const index=
    list.indexOf(skill);

  if(index>=0){

    list.splice(index,1);

  }else{

    if(list.length>=3){

      alert(
        "スキルは最大3個までです。"
      );

      seTone(
        70,
        .2
      );

      return;

    }

    list.push(skill);

    seTone(
      280,
      .12
    );

  }

  saveGame();

  renderEquip();

}


/* =========================
   CHARACTER
========================= */

function selectCharacter(name){

  gameData.character=name;

  document.getElementById(
    "selectedCharacter"
  ).textContent=name;

  saveGame();

  seTone(
    260,
    .12
  );

}


/* =========================
   SETTINGS
========================= */

function toggleBGM(){

  gameData.bgm=
    !gameData.bgm;

  document.getElementById(
    "bgmState"
  ).textContent=
    gameData.bgm?"ON":"OFF";

  if(gameData.bgm){

    startBGM();

  }else{

    stopBGM();

  }

  saveGame();

}


function toggleSE(){

  gameData.se=
    !gameData.se;

  document.getElementById(
    "seState"
  ).textContent=
    gameData.se?"ON":"OFF";

  saveGame();

  if(gameData.se){

    seTone(
      300,
      .12
    );

  }

}


/* =========================
   DELETE SAVE
========================= */

function deleteSave(){

  if(
    confirm(
      "セーブデータを削除しますか？"
    )
  ){

    localStorage.removeItem(
      "thavmaSave"
    );

    gameData={
      gems:300,
      character:"旅人",
      bgm:true,
      se:true,
      equipped:[]
    };

    updateGemDisplays();

    renderEquip();

    alert(
      "セーブデータを削除しました。"
    );

  }

}
