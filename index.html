<style>
*{

    margin:0;
    padding:0;
}

body{

    color:white;
    font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;
    overflow:hidden;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:-5;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 50% 35%,rgba(30,80,180,.18),transparent 45%),
        radial-gradient(circle at 80% 80%,rgba(0,120,255,.08),transparent 40%);
    pointer-events:none;
    z-index:-4;
}

.screen{
    width:100%;
    height:100vh;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    padding:20px;
}

.screen.active{
    display:flex;
}

.title{
    font-size:clamp(60px,14vw,135px);
    letter-spacing:.12em;
    color:#e5faff;
    text-shadow:
        0 0 10px #65cfff,
        0 0 30px #258cff,
        0 0 70px #1765ff;
}

.subtitle{
    color:#9eb7d8;
    letter-spacing:.18em;
    margin-top:5px;
    margin-bottom:50px;
}

.menu{
    width:min(340px,90vw);
    display:flex;
    flex-direction:column;
    gap:13px;
}

button{
    border:1px solid rgba(110,190,255,.45);
    background:rgba(4,18,48,.8);
    color:#e7f8ff;
    padding:14px 18px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:rgba(20,65,130,.85);
    border-color:#65cfff;
    box-shadow:0 0 25px rgba(70,180,255,.25);
    transform:translateY(-2px);
}

.story-box{
    width:min(900px,95vw);
    max-height:90vh;
    overflow-y:auto;
    padding:30px;
    border:1px solid rgba(100,190,255,.25);
    border-radius:18px;

    box-shadow:0 0 45px rgba(20,100,255,.12);
}

.chapter{
    color:#70cfff;
    font-size:14px;
    letter-spacing:.12em;
    margin-bottom:18px;
}

.character-name{
    font-size:21px;
    font-weight:bold;
    margin-bottom:18px;
    text-shadow:0 0 12px rgba(100,200,255,.5);
}

.story-text{

    line-height:2;
    color:#dcecff;
    min-height:130px;
}

.choices{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:20px;
}

.next-area{

    flex-wrap:wrap;
    gap:10px;

}

.character-grid{

    max-height:75vh;

    display:grid;

    border-radius:15px;

.character-card:hover{

    font-size:13px;

}

.card-desc{

.counter{

.guren-hp{

    box-shadow:0 0 15px rgba(255,30,70,.5);

.enemy-hp{

    height:130px;

    position:relative;

        rgba(255,60,80,.9) 0%,

    position:absolute;
    border-radius:50%;
    background:#ff3155;
    box-shadow:0 0 15px #ff3155;
}

.guren-visual::before{
    width:9px;
    height:9px;
    top:5px;
    left:25px;
}

.guren-visual::after{
    width:6px;
    height:6px;
    right:15px;
    bottom:25px;
}

    from{
        transform:scale(.94);
        filter:brightness(.8);
    }
    to{
        transform:scale(1.06);
        filter:brightness(1.35);
    }

    height:150px;
    margin:10px auto 20px;

/* =========================================================
   星空
========================================================= */

const canvas=document.getElementById("spaceCanvas");
const ctx=canvas.getContext("2d");

let stars=[];

function resizeCanvas(){

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    stars=[];

    for(let i=0;i<180;i++){

        stars.push({
            x:Math.random()*canvas.width,
            y:Math.random()*canvas.height,
            r:Math.random()*1.5+.2,
            speed:Math.random()*.25+.05,
            alpha:Math.random()*.8+.2
        });

    }
}

function animateSpace(time){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    for(const star of stars){

        star.y+=star.speed;

        if(star.y>canvas.height){

            star.y=0;
            star.x=Math.random()*canvas.width;

        }

        const pulse=
            .6+
            Math.sin(time*.001+star.x)*.25;

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            `rgba(180,220,255,${star.alpha*pulse})`;

        ctx.fill();
    }

    requestAnimationFrame(animateSpace);
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();

requestAnimationFrame(animateSpace);


/* =========================================================
   オーディオ
========================================================= */

let audioContext=null;
let bgmEnabled=true;
let bgmOscillators=[];

function initAudio(){

    if(!audioContext){

        audioContext=
            new(window.AudioContext||
                window.webkitAudioContext)();

        startBGM();
    }

    if(audioContext.state==="suspended"){
        audioContext.resume();
    }
}

function clickSound(){

    if(!audioContext) return;

    const osc=
        audioContext.createOscillator();

    const gain=
        audioContext.createGain();

    osc.frequency.value=650;

    gain.gain.setValueAtTime(
        .025,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+.1
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();

    osc.stop(
        audioContext.currentTime+.1
    );
}

function sparkleSound(){

    if(!audioContext) return;

    const osc=
        audioContext.createOscillator();

    const gain=
        audioContext.createGain();

    osc.frequency.setValueAtTime(
        700,
        audioContext.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        1200,
        audioContext.currentTime+.3
    );

    gain.gain.setValueAtTime(
        .04,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+.3
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();

    osc.stop(
        audioContext.currentTime+.3
    );
}

function startBGM(){

    if(!audioContext||!bgmEnabled) return;

    stopBGM();

    const notes=[
        220,
        277,
        330,
        440
    ];

    notes.forEach(freq=>{

        const osc=
            audioContext.createOscillator();

        const gain=
            audioContext.createGain();

        osc.type="sine";
        osc.frequency.value=freq;
        gain.gain.value=.006;

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();

        bgmOscillators.push(osc);
    });
}

function stopBGM(){

    bgmOscillators.forEach(osc=>{

        try{
            osc.stop();
        }catch(e){}

    });

    bgmOscillators=[];
}

function toggleBGM(){

    initAudio();

    bgmEnabled=!bgmEnabled;

    if(bgmEnabled){
        startBGM();
    }else{
        stopBGM();
    }
}

const SAVE_KEY="thavma_save";

let currentStory="start";

let unlockedCharacters=[
    "geboku"
];

function saveGame(){

    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify({
            currentStory,
            unlockedCharacters
        })
    );
}

function loadGame(){

    try{

        const data=
            JSON.parse(
                localStorage.getItem(SAVE_KEY)
            );

        if(!data) return false;

        currentStory=
            data.currentStory||"start";

        unlockedCharacters=
            Array.isArray(data.unlockedCharacters)
            ?data.unlockedCharacters
            :["geboku"];

        return true;

    }catch(e){

        return false;
    }
}

function resetSave(){

    if(
        confirm(
            "セーブデータと図鑑の解放状況を消去しますか？"
        )
    ){

        localStorage.removeItem(SAVE_KEY);

        currentStory="start";

        unlockedCharacters=[
            "geboku"
        ];

        alert(
            "セーブデータを消去しました。"
        );
    }
}

function unlockCharacter(id){

    if(!characters[id]) return;

    if(!unlockedCharacters.includes(id)){

        unlockedCharacters.push(id);

        saveGame();

        sparkleSound();
    }
}

function unlockForStory(key){

    unlockCharacter("geboku");

    if([
        "guren",
        "choiceA",
        "choiceB",
        "homurabiB",
        "chapter2Guren",
        "chapter3Guren",
        "chapter3AfterBattle",
        "chapter3Truth"
    ].includes(key)){

        unlockCharacter("guren");
    }

    if([
        "homurabi",
        "homurabiA",
        "homurabiB",
        "chapter2Mysterious",
        "chapter3Danger"
    ].includes(key)){

        unlockCharacter("homurabi");
    }

    if([
        "chapter2Kagari",
        "chapter2ChoiceA",
        "chapter2ChoiceB"
    ].includes(key)){

        unlockCharacter("kagari");
    }
}


/* =========================================================
   画面
========================================================= */

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(screen=>{
            screen.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");
}

function fadeTransition(callback){

    const fade=
        document.getElementById("fade");

    fade.classList.add("show");

    setTimeout(()=>{

        callback();

        setTimeout(()=>{
            fade.classList.remove("show");
        },100);

    },400);
}


/* =========================================================
   ゲーム
========================================================= */

function startGame(){

    initAudio();

    currentStory="start";

    unlockedCharacters=[
        "geboku"
    ];

    saveGame();

    fadeTransition(()=>{

        showScreen("storyScreen");

        showStory();

    });
}

function continueGame(){

    initAudio();

    if(!loadGame()){

        alert(
            "セーブデータはまだありません。\n"+
            "「はじめから」からゲームを開始してください。"
        );

        return;
    }

    fadeTransition(()=>{

        showScreen("storyScreen");

        showStory();

    });
}

function showStory(){

    const data=
        story[currentStory];

    if(!data) return;

    unlockForStory(currentStory);

    document.getElementById(
        "chapter"
    ).textContent=data.chapter;

    document.getElementById(
        "characterName"
    ).textContent=data.name;

    document.getElementById(
        "storyText"
    ).textContent=data.text;

    const choices=
        document.getElementById("choices");

    choices.innerHTML="";

    if(data.choices){

        data.choices.forEach(choice=>{

            const button=
                document.createElement("button");

            button.textContent=
                "▶ "+choice[0];

            button.onclick=()=>{

                initAudio();

                clickSound();

                currentStory=
                    choice[1];

                saveGame();

                showStory();

            };

            choices.appendChild(button);

        });
    }

    const nextButton=
        document.getElementById("nextButton");

    if(data.next){

        nextButton.style.display="inline-block";

    }else{

        nextButton.style.display="none";
    }

    saveGame();
}

function nextStory(){

    initAudio();

    const data=
        story[currentStory];

    if(!data||!data.next) return;

    clickSound();

    if(data.next==="startBattle"){

        startBattle();

        return;
    }

    currentStory=data.next;

    saveGame();

    showStory();
}

function backToTitle(){

    saveGame();

    fadeTransition(()=>{
        showScreen("titleScreen");
    });
}

        const ids=[
            "geboku",

            if(
                !unlockedCharacters.includes(id)
            ){

                card.classList.add("locked");

                card.innerHTML=`
                    <div class="card-name">

                    </div>

                    <div class="card-status">
                        未解放
                    </div>

                    <div class="card-desc">
                        この人物とは、まだ出会っていない。
                    </div>
                `;

            }else{

                const c=
                    characters[id];

                card.innerHTML=`
                    <div class="card-name">
                        ${c.name}
                    </div>

                    <div class="card-status">
                        解放済み
                    </div>

                    <div class="card-desc">
                        タップして詳細を見る
                    </div>
                `;

                card.onclick=()=>{
                    showCharacterDetail(id);
                };
            }

            grid.appendChild(card);
        });

        document.getElementById(
            "characterCounter"
        ).textContent=
            `解放済み：${unlockedCharacters.length} / 4`;

    });
}

function showCharacterDetail(id){

    if(
        !unlockedCharacters.includes(id)
    ) return;

    initAudio();

    clickSound();

    const c=
        characters[id];

    document.getElementById(
        "detailName"
    ).textContent=c.name;

    document.getElementById(
        "detailText"
    ).textContent=c.description;

    fadeTransition(()=>{

        showScreen(
            "characterDetailScreen"
        );

    });
}

let gurenHP=1000;
let goblinHP=500;

let battleTurn=1;

let ghostMode=false;
let bloodFieldUsed=false;
let warGodUsed=false;
let battleLocked=false;

function startBattle(){

    initAudio();

    gurenHP=1000;
    goblinHP=500;

    battleTurn=1;

    ghostMode=false;
    bloodFieldUsed=false;
    warGodUsed=false;
    battleLocked=false;

    document.getElementById(
        "battleResult"
    ).innerHTML="";

    document.getElementById(
        "battleCommands"
    ).style.display="grid";

    updateBattleUI();

    setBattleLog(
        "ゴブリンが現れた！\n"+
        "皇 紅蓮のターン。"
    );

    showScreen("battleScreen");
}

function updateBattleUI(){

    const gurenPercent=
        Math.max(0,gurenHP)/1000*100;

    const goblinPercent=
        Math.max(0,goblinHP)/500*100;

    document.getElementById(
        "gurenHPBar"
    ).style.width=
        gurenPercent+"%";

    document.getElementById(
        "goblinHPBar"
    ).style.width=
        goblinPercent+"%";

    document.getElementById(
        "gurenHPText"
    ).textContent=
        `${Math.max(0,gurenHP)} / 1000`;

    document.getElementById(
        "goblinHPText"
    ).textContent=
        `${Math.max(0,goblinHP)} / 500`;

    document.getElementById(
        "battleTurn"
    ).textContent=
        `ターン ${battleTurn}　｜　皇 紅蓮のターン`;
}

function setBattleLog(text){

    document.getElementById(
        "battleLog"
    ).textContent=text;
}

function appendBattleLog(text){

    const log=
        document.getElementById("battleLog");

    log.textContent+=
        "\n"+text;

    log.scrollTop=
        log.scrollHeight;
}

function lockBattle(){

    battleLocked=true;

    document.getElementById(
        "battleCommands"
    ).style.pointerEvents=
        "none";
}

function unlockBattle(){

    battleLocked=false;

    document.getElementById(
        "battleCommands"
    ).style.pointerEvents=
        "auto";
}

function battleAttack(){

    if(battleLocked||goblinHP<=0) return;

    initAudio();
    clickSound();

    const damage=
        Math.floor(
            Math.random()*81
        )+120;

    goblinHP-=damage;

    appendBattleLog(
        `皇 紅蓮の攻撃！ ゴブリンに ${damage} ダメージ。`
    );

    updateBattleUI();

    if(goblinHP<=0){

        winBattle();

        return;
    }

    enemyTurn();
}

function battleBloodField(){

    if(
        battleLocked||
        bloodFieldUsed||
        goblinHP<=0
    ) return;

    initAudio();
    clickSound();

    bloodFieldUsed=true;

    const damage=170;

    goblinHP-=damage;

    appendBattleLog(
        "皇 紅蓮が《血界支配》を発動！"
    );

    appendBattleLog(
        `赤い血液のような光が周囲を覆い、${damage}ダメージ。`
    );

    updateBattleUI();

    if(goblinHP<=0){

        winBattle();

        return;
    }

    enemyTurn();
}

function battleGhost(){

    if(
        battleLocked||
        goblinHP<=0
    ) return;

    initAudio();
    clickSound();

    ghostMode=true;

    appendBattleLog(
        "皇 紅蓮は《幽体化》した！"
    );

    appendBattleLog(
        "次のゴブリンの攻撃をすり抜ける。"
    );

    enemyTurn();
}

function battleWarGod(){

    if(
        battleLocked||
        warGodUsed||
        goblinHP<=0
    ) return;

    initAudio();
    clickSound();

    warGodUsed=true;

    const damage=230;

    goblinHP-=damage;

    appendBattleLog(
        "皇 紅蓮が《武神》を発動！"
    );

    appendBattleLog(
        `研ぎ澄まされた一撃。${damage}ダメージ。`
    );

    updateBattleUI();

    if(goblinHP<=0){

        winBattle();

        return;
    }

    enemyTurn();
}

function enemyTurn(){

    lockBattle();

    setTimeout(()=>{

        if(goblinHP<=0) return;

        if(ghostMode){

            appendBattleLog(
                "ゴブリンの攻撃！"
            );

            appendBattleLog(
                "しかし、皇 紅蓮は幽体化して攻撃をすり抜けた！"
            );

            ghostMode=false;

        }else{

            const damage=
                Math.floor(
                    Math.random()*51
                )+50;

            gurenHP-=damage;

            appendBattleLog(
                `ゴブリンの攻撃！ 皇 紅蓮に ${damage} ダメージ。`
            );

            updateBattleUI();

            if(gurenHP<=0){

                loseBattle();

                return;
            }
        }

        battleTurn++;

        updateBattleUI();

        appendBattleLog(
            "皇 紅蓮のターン。"
        );

        unlockBattle();

    },700);
}

function winBattle(){

    battleLocked=true;

    document.getElementById(
        "battleCommands"
    ).style.display="none";

    document.getElementById(
        "battleResult"
    ).innerHTML=
        `<div class="battle-result">
            ✦ VICTORY ✦
            <br>
            <button onclick="finishBattle()">
                ▶ ストーリーへ
            </button>
        </div>`;

    appendBattleLog(
        "ゴブリンを撃退した！"
    );

    sparkleSound();
}

function loseBattle(){

    battleLocked=true;

    document.getElementById(
        "battleCommands"
    ).style.display="none";

    document.getElementById(
        "battleResult"
    ).innerHTML=
        `<div class="battle-result">
            皇 紅蓮は戦闘不能になった……
            <br><br>
            <button onclick="startBattle()">
                ↻ 再戦
            </button>
        </div>`;

    appendBattleLog(
        "戦闘に敗北した……。"
    );
}

function finishBattle(){

    currentStory=
        "chapter3AfterBattle";

    saveGame();

    fadeTransition(()=>{

        showScreen("storyScreen");

        showStory();

    });
}

</script>

</body>
</html>
