<title>Θαύμα</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#090912;
  color:#fff;
}

button{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:1px solid #555;
  border-radius:10px;
  background:#171725;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#25253a;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

h1,h2,h3{
  margin-top:0;
}

#app{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.title{
  text-align:center;
  padding:60px 10px 30px;
}

.title h1{
  font-size:52px;
  letter-spacing:8px;
}

.subtitle{
  color:#aaa;
  margin-bottom:30px;
}

.panel{
  background:#11111d;
  border:1px solid #303044;
  border-radius:14px;
  padding:18px;
  margin-bottom:15px;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

@media(max-width:600px){
  .menu-grid{
    grid-template-columns:1fr;
  }
}

.back{
  margin-bottom:15px;
}

.story-box{
  min-height:300px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.chapter{
  color:#b9a7ff;
  font-size:14px;
  margin-bottom:10px;
}

.story-title{
  font-size:28px;
  margin-bottom:20px;
}

.story-text{
  white-space:pre-wrap;
  line-height:2;
  color:#eee;
  font-size:17px;
}

.character{
  border:1px solid #33334a;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
}

.character h3{
  margin-bottom:6px;
}

.stat{
  color:#bbb;
  line-height:1.7;
}

.skill{
  border:1px solid #33334a;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
}

.rarity{
  font-weight:bold;
}

.r{
  color:#aaa;
}

.sr{
  color:#72a7ff;
}

.ssr{
  color:#c38cff;
}

.ur{
  color:#ffb84d;
}

.lr{
  color:#ff5d8f;
}

.log{
  background:#08080e;
  border:1px solid #292936;
  border-radius:10px;
  padding:12px;
  height:180px;
  overflow-y:auto;
  white-space:pre-wrap;
  margin-bottom:15px;
}

.hp{
  height:20px;
  background:#292936;
  border-radius:10px;
  overflow:hidden;
  margin:8px 0 15px;
}

.hp-inner{
  height:100%;
  background:#d84b63;
  transition:width .25s;
}

.notice{
  padding:15px;
  background:#1d1830;
  border:1px solid #5d4a91;
  border-radius:12px;
  margin-bottom:15px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#20202d;
  border:1px solid #777;
  padding:13px 20px;
  border-radius:30px;
  display:none;
  z-index:999;
}

.small{
  color:#999;
  font-size:13px;
}

.center{
  text-align:center;
}

select{
  width:100%;
  padding:12px;
  background:#171725;
  color:#fff;
  border:1px solid #555;
  border-radius:8px;
  margin:5px 0;
}
</style>
</head>

<body>

<div id="app">

<!-- ==================== TITLE ==================== -->

<div id="titleScreen" class="screen active">
  <div class="title">
    <h1>Θαύμα</h1>
    <div class="subtitle">―― 世界の外側にある物語 ――</div>
  </div>

  <div class="panel">
    <button onclick="startNewGame()">はじめから</button>
    <button onclick="continueGame()">つづきから</button>

    <div class="menu-grid">
      <button onclick="showScreen('charactersScreen')">キャラクター図鑑</button>
      <button onclick="showScreen('skillsScreen')">スキル図鑑</button>
      <button onclick="showScreen('gachaScreen')">スキルガチャ</button>
      <button onclick="showScreen('challengeScreen')">挑戦</button>
      <button onclick="showScreen('equipScreen')">スキルセット</button>
      <button onclick="showScreen('battleCharacterScreen')">戦闘キャラ選択</button>
      <button onclick="showScreen('settingsScreen')">設定</button>
    </div>
  </div>

  <div class="panel center">
    <div>所持石：<span id="titleStones">300</span></div>
  </div>
</div>


<!-- ==================== STORY ==================== -->

<div id="storyScreen" class="screen">

  <button class="back" onclick="backToTitle()">← タイトルへ</button>

  <div class="panel story-box">
    <div id="storyChapter" class="chapter"></div>
    <div id="storyTitle" class="story-title"></div>
    <div id="storyText" class="story-text"></div>
  </div>

  <button id="nextStoryButton" onclick="nextStory()">次へ</button>

</div>


<!-- ==================== CHARACTERS ==================== -->

<div id="charactersScreen" class="screen">

  <button class="back" onclick="backToTitle()">← 戻る</button>

  <div class="panel">
    <h2>キャラクター図鑑</h2>
  </div>

  <div id="characterList"></div>

</div>


<!-- ==================== SKILLS ==================== -->

<div id="skillsScreen" class="screen">

  <button class="back" onclick="backToTitle()">← 戻る</button>

  <div class="panel">
    <h2>スキル図鑑</h2>
  </div>

  <div id="skillList"></div>

</div>


<!-- ==================== GACHA ==================== -->

<div id="gachaScreen" class="screen">

  <button class="back" onclick="backToTitle()">← 戻る</button>

  <div class="panel center">
    <h2>スキルガチャ</h2>
    <p>所持石：<span id="gachaStones">0</span></p>

    <button onclick="gacha(1)">1回引く　300石</button>
    <button onclick="gacha(10)">10回引く　3000石</button>

    <div id="gachaResult"></div>
  </div>

</div>


<!-- ==================== CHALLENGE ==================== -->

<div id="challengeScreen" class="screen">

  <button class="back" onclick="backToTitle()">← 戻る</button>

  <div id="challengeMenu">

    <div class="panel">
      <h2>挑戦</h2>
      <p class="small">強敵との戦闘に挑めます。</p>
    </div>

    <div id="enemyList"></div>

  </div>

  <div id="challengeBattle" style="display:none;">

    <div class="panel">
      <h2 id="battleEnemyName"></h2>

      <div>敵HP</div>
      <div class="hp">
        <div id="enemyHpBar" class="hp-inner"></div>
      </div>

      <div>味方HP</div>
      <div class="hp">
        <div id="playerHpBar" class="hp-inner"></div>
      </div>
    </div>

    <div id="battleLog" class="log"></div>

    <div class="panel">
      <button onclick="battleAttack()">攻撃</button>
      <button onclick="battleGuard()">防御</button>
      <div id="battleSkillButtons"></div>
    </div>

  </div>

</div>


<!-- ==================== EQUIP ==================== -->

<div id="equipScreen" class="screen">

  <button class="back" onclick="backToTitle()">← 戻る</button>

  <div class="panel">
    <h2>スキルセット</h2>
    <p class="small">各キャラクター最大3個まで装備できます。</p>
  </div>

  <div id="equipList"></div>

</div>


<!-- ==================== BATTLE CHARACTER ==================== -->

<div id="battleCharacterScreen" class="screen">

  <button class="back" onclick="backToTitle()">← 戻る</button>

  <div class="panel">
    <h2>戦闘キャラ選択</h2>
    <div id="battleCharacterList"></div>
  </div>

</div>


<!-- ==================== SETTINGS ==================== -->

<div id="settingsScreen" class="screen">

  <button class="back" onclick="backToTitle()">← 戻る</button>

  <div class="panel">

    <h2>設定</h2>

    <button onclick="toggleBGM()">
      BGM：<span id="bgmState">ON</span>
    </button>

    <button onclick="deleteSave()">
      セーブデータ削除
    </button>

  </div>

</div>

</div>

<div id="toast" class="toast"></div>

/* =========================================================
   初期セーブ
========================================================= */

function createDefaultSave(){

  return {
    stones:300,

    storyIndex:0,

    ownedSkills:[
      "slash",
      "blood",
      "guard"
    ],

    equippedSkills:{
      gouen:["slash","blood","guard"],
      geboku:["slash","guard"],
      homurabikun:["slash"],
      touei:["eternalflame","end"]
    },

    defeatedEnemies:[],

    selectedCharacter:"gouen",

    bgm:true,

    flags:{
      gouenUnconscious:false,
      whiteRoomSeen:false,
      toueiAngered:false,
      gebokuAwakened:false
    }
  };

}


let game = createDefaultSave();


/* =========================================================
   戦闘状態
========================================================= */

let battle = null;


/* =========================================================
   セーブ
========================================================= */

function saveGame(){

  try{
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(game)
    );
  }catch(error){
    console.warn("セーブ失敗",error);
  }

}


function loadGame(){

  try{

    const raw = localStorage.getItem(STORAGE_KEY);

    if(!raw){
      return false;
    }

    const saved = JSON.parse(raw);

    const defaults = createDefaultSave();

    game = {

      ...defaults,
      ...saved,

      equippedSkills:{
        ...defaults.equippedSkills,
        ...(saved.equippedSkills || {})
      },

      flags:{
        ...defaults.flags,
        ...(saved.flags || {})
      }

    };

    if(!Array.isArray(game.ownedSkills)){
      game.ownedSkills = [...defaults.ownedSkills];
    }

    if(!Array.isArray(game.defeatedEnemies)){
      game.defeatedEnemies = [];
    }

    if(typeof game.storyIndex !== "number"){
      game.storyIndex = 0;
    }

    if(typeof game.stones !== "number"){
      game.stones = 300;
    }

    return true;

  }catch(error){

    console.warn("セーブデータ破損。初期化します。");

    game = createDefaultSave();

    return false;
  }

}


/* =========================================================
   画面
========================================================= */

function showScreen(id){

  document.querySelectorAll(".screen").forEach(screen=>{
    screen.classList.remove("active");
  });

  const target = document.getElementById(id);

  if(target){
    target.classList.add("active");
  }

  if(id === "charactersScreen"){
    renderCharacters();
  }

  if(id === "skillsScreen"){
    renderSkills();
  }

  if(id === "gachaScreen"){
    renderGacha();
  }

  if(id === "challengeScreen"){
    renderChallengeMenu();
  }

  if(id === "equipScreen"){
    renderEquip();
  }

  if(id === "battleCharacterScreen"){
    renderBattleCharacters();
  }

  if(id === "settingsScreen"){
    renderSettings();
  }

  updateTitleInfo();
}


function backToTitle(){

  if(battle){
    battle = null;
  }

  showScreen("titleScreen");
}


/* =========================================================
   新規 / 続き
========================================================= */

function startNewGame(){

  const ok = confirm(
    "現在のセーブデータを消して、最初から始めますか？"
  );

  if(!ok){
    return;
  }

  game = createDefaultSave();

  saveGame();

  startStory();

}


function continueGame(){

  const loaded = loadGame();

  if(!loaded){
    alert("セーブデータがありません。");
    return;
  }

  startStory();

}


/* =========================================================
   ストーリー
========================================================= */

function startStory(){

  showScreen("storyScreen");

  renderStory();

}


function renderStory(){

  if(game.storyIndex < 0){
    game.storyIndex = 0;
  }

  if(game.storyIndex >= story.length){
    game.storyIndex = story.length - 1;
  }

  const scene = story[game.storyIndex];

  document.getElementById("storyChapter").textContent =
    scene.chapter;

  document.getElementById("storyTitle").textContent =
    scene.title;

  document.getElementById("storyText").textContent =
    scene.text;

  const button =
    document.getElementById("nextStoryButton");

  if(game.storyIndex === story.length - 1){
    button.textContent = "タイトルへ";
  }else{
    button.textContent = "次へ";
  }

}


function nextStory(){

  /*
    最後のシーンなら終了。
  */

  if(game.storyIndex >= story.length - 1){

    finishChapter6();

    showScreen("titleScreen");

    return;
  }


  game.storyIndex++;

  handleStoryFlags();

  saveGame();

  renderStory();

}


/* =========================================================
   ストーリーイベント
========================================================= */

function handleStoryFlags(){

  const scene = story[game.storyIndex];

  if(!scene){
    return;
  }


  /* 皇が倒れた */

  if(
    scene.chapter === "第6章" &&
    scene.title === "敗北"
  ){

    game.flags.gouenUnconscious = true;

  }


  /* 灯影が怒る */

  if(
    scene.chapter === "第6章" &&
    scene.title === "灯影"
  ){

    game.flags.toueiAngered = true;

  }


  /* 白い部屋 */

  if(
    scene.chapter === "第6章" &&
    scene.title === "白い部屋"
  ){

    game.flags.whiteRoomSeen = true;

  }

}


/* =========================================================
   第6章終了
========================================================= */

function finishChapter6(){

  if(!game.flags.gebokuAwakened){

    game.flags.gebokuAwakened = true;

    if(!game.ownedSkills.includes("copy")){
      game.ownedSkills.push("copy");
    }

    if(!Array.isArray(game.equippedSkills.geboku)){
      game.equippedSkills.geboku = [];
    }

    if(!game.equippedSkills.geboku.includes("copy")){

      if(game.equippedSkills.geboku.length >= 3){
        game.equippedSkills.geboku.shift();
      }

      game.equippedSkills.geboku.push("copy");

    }

    saveGame();

    alert(
      "【覚醒】\n\n" +
      "下僕が覚醒した！\n\n" +
      "新スキル「コピー」を習得しました。"
    );

  }else{

    saveGame();

  }

}

/* =========================================================
   ガチャ
========================================================= */

function renderGacha(){

  document.getElementById("gachaStones").textContent =
    game.stones;

}


function gacha(count){

  const cost = count * 300;

  if(game.stones < cost){

    toast("石が足りません。");

    return;
  }

  game.stones -= cost;

  const results = [];

  for(let i=0;i<count;i++){

    const rarity = rollRarity();

    const pool = gachaPool[rarity];

    const skillId =
      pool[Math.floor(Math.random()*pool.length)];

    results.push(skillId);

    if(!game.ownedSkills.includes(skillId)){
      game.ownedSkills.push(skillId);
    }

  }

  saveGame();

  renderGacha();

  let html = "<h3>結果</h3>";

  results.forEach(id=>{

    const skill = skills[id];

    html += `
      <div class="skill">
        ${escapeHTML(skill.name)}
        <span class="rarity ${rarityClass(skill.rarity)}">
          [${skill.rarity}]
        </span>
      </div>
    `;

  });

  document.getElementById("gachaResult").innerHTML =
    html;

  updateTitleInfo();

}


function rollRarity(){

  const n = Math.random() * 100;

  if(n < 0.2){
    return "LR";
  }

  if(n < 2){
    return "UR";
  }

  if(n < 8){
    return "SSR";
  }

  if(n < 25){
    return "SR";
  }

  return "R";

}

/* =========================================================
   戦闘開始
========================================================= */

function startChallenge(enemyId){

  const enemy = enemies[enemyId];

  if(!enemy){
    return;
  }

  const character =
    characters[game.selectedCharacter];

  if(!character){
    return;
  }

  battle = {

    enemyId:enemyId,

    enemyHp:enemy.hp,

    playerHp:character.hp,

    maxEnemyHp:enemy.hp,

    maxPlayerHp:character.hp,

    guard:false,

    ended:false

  };


  document.getElementById("challengeMenu").style.display =
    "none";

  document.getElementById("challengeBattle").style.display =
    "block";


  document.getElementById("battleEnemyName").textContent =
    enemy.name;


  document.getElementById("battleLog").textContent = "";


  addBattleLog(
    `${character.name} VS ${enemy.name}`
  );

  addBattleLog(
    "戦闘開始！"
  );


  renderBattleSkills();

  renderBattle();

}


/* =========================================================
   戦闘表示
========================================================= */

function renderBattle(){

  if(!battle){
    return;
  }

  const enemy =
    enemies[battle.enemyId];

  const player =
    characters[game.selectedCharacter];


  const enemyPercent =
    Math.max(
      0,
      Math.min(
        100,
        battle.enemyHp / battle.maxEnemyHp * 100
      )
    );


  const playerPercent =
    Math.max(
      0,
      Math.min(
        100,
        battle.playerHp / battle.maxPlayerHp * 100
      )
    );


  document.getElementById("enemyHpBar").style.width =
    enemyPercent + "%";

  document.getElementById("playerHpBar").style.width =
    playerPercent + "%";


  document.getElementById("battleEnemyName").textContent =
    enemy.name +
    `　HP ${Math.max(0,battle.enemyHp)} / ${battle.maxEnemyHp}`;

}


/* =========================================================
   戦闘ログ
========================================================= */

function addBattleLog(text){

  const log =
    document.getElementById("battleLog");

  log.textContent += text + "\n";

  log.scrollTop = log.scrollHeight;

}


/* =========================================================
   攻撃
========================================================= */

function battleAttack(){

  if(!canBattle()){
    return;
  }

  const player =
    characters[game.selectedCharacter];

  const enemy =
    enemies[battle.enemyId];


  let damage =
    player.attack -
    Math.floor(enemy.defense * 0.3);

  damage = Math.max(1,damage);


  /*
    アポカリプスは簡単に倒せない。
  */

  if(enemy.boss){

    damage =
      Math.min(
        damage,
        1000
      );

  }


  battle.enemyHp -= damage;


  addBattleLog(
    `${player.name}の攻撃！ ${damage}ダメージ！`
  );


  afterPlayerAction();

}


/* =========================================================
   防御
========================================================= */

function battleGuard(){

  if(!canBattle()){
    return;
  }

  battle.guard = true;

  addBattleLog(
    "防御態勢に入った！"
  );

  enemyTurn();

}


/* =========================================================
   スキル
========================================================= */

function useBattleSkill(skillId){

  if(!canBattle()){
    return;
  }

  if(!game.ownedSkills.includes(skillId)){
    return;
  }

  const skill =
    skills[skillId];

  const player =
    characters[game.selectedCharacter];

  const enemy =
    enemies[battle.enemyId];


  if(skillId === "guard"){

    battle.guard = true;

    addBattleLog(
      `${skill.name}！ 次の攻撃を回避しやすくする！`
    );

    enemyTurn();

    return;
  }


  let damage =
    player.attack +
    skill.damage -
    Math.floor(enemy.defense * 0.3);


  damage = Math.max(1,damage);


  if(skillId === "future"){

    battle.guard = true;

    addBattleLog(
      "未来予知により、次の攻撃を読み取る！"
    );

  }


  /*
    コピー
    アポカリプス相手なら強化。
  */

  if(skillId === "copy"){

    if(enemy.boss){

      damage = 2500;

      addBattleLog(
        "【覚醒】コピーが敵の力を解析した！"
      );

    }else{

      damage = 400;

      addBattleLog(
        "コピーした力を再現！"
      );

    }

  }


  /*
    終焉支配もボスには上限を設定。
  */

  if(enemy.boss && skillId === "end"){

    damage = 1000;

    addBattleLog(
      "終焉支配が抵抗された！"
    );

  }


  battle.enemyHp -= damage;


  addBattleLog(
    `${skill.name}！ ${damage}ダメージ！`
  );


  afterPlayerAction();

}


/* =========================================================
   プレイヤー行動後
========================================================= */

function afterPlayerAction(){

  if(checkBattleEnd()){
    return;
  }

  enemyTurn();

}


/* =========================================================
   敵ターン
========================================================= */

function enemyTurn(){

  if(!battle || battle.ended){
    return;
  }

  const enemy =
    enemies[battle.enemyId];

  const player =
    characters[game.selectedCharacter];


  let damage =
    enemy.attack -
    Math.floor(player.defense * 0.3);


  damage = Math.max(1,damage);


  /*
    防御
  */

  if(battle.guard){

    const evade =
      Math.random() < 0.75;

    if(evade){

      addBattleLog(
        `${player.name}は攻撃を回避した！`
      );

      battle.guard = false;

      renderBattle();

      return;

    }else{

      damage =
        Math.floor(damage * 0.4);

      addBattleLog(
        `${player.name}は防御した！`
      );

    }

  }


  /*
    アポカリプス
  */

  if(enemy.boss){

    damage = Math.max(
      500,
      damage
    );

  }


  battle.playerHp -= damage;


  addBattleLog(
    `${enemy.name}の攻撃！ ${damage}ダメージ！`
  );


  battle.guard = false;

  checkBattleEnd();

  renderBattle();

}


/* =========================================================
   戦闘終了判定
========================================================= */

function checkBattleEnd(){

  if(!battle){
    return true;
  }

  if(battle.enemyHp <= 0){

    winBattle();

    return true;
  }


  if(battle.playerHp <= 0){

    loseBattle();

    return true;
  }


  renderBattle();

  return false;

}


/* =========================================================
   勝利
========================================================= */

function winBattle(){

  if(!battle || battle.ended){
    return;
  }

  battle.ended = true;

  const enemyId =
    battle.enemyId;

  const enemy =
    enemies[enemyId];


  addBattleLog(
    "勝利！"
  );


  if(!game.defeatedEnemies.includes(enemyId)){

    game.defeatedEnemies.push(enemyId);

    game.stones += enemy.reward;

    addBattleLog(
      `${enemy.reward}石を獲得！`
    );

  }else{

    addBattleLog(
      "この敵はすでに撃破済みです。"
    );

  }


  saveGame();

  setTimeout(()=>{

    alert(
      `${enemy.name}に勝利しました！`
    );

    battle = null;

    renderChallengeMenu();

  },100);

}


/* =========================================================
   敗北
========================================================= */

function loseBattle(){

  if(!battle || battle.ended){
    return;
  }

  battle.ended = true;

  addBattleLog(
    "敗北……"
  );


  setTimeout(()=>{

    alert(
      "戦闘に敗北しました。"
    );

    battle = null;

    renderChallengeMenu();

  },100);

}


/* =========================================================
   戦闘ボタン
========================================================= */

function canBattle(){

  return (
    battle !== null &&
    !battle.ended
  );

}


function renderBattleSkills(){

  const container =
    document.getElementById("battleSkillButtons");

  container.innerHTML = "";

  const equipped =
    game.equippedSkills[
      game.selectedCharacter
    ] || [];


  equipped.forEach(skillId=>{

    const skill =
      skills[skillId];

    if(!skill){
      return;
    }

    const button =
      document.createElement("button");

    button.textContent =
      `${skill.name} [${skill.rarity}]`;

    button.onclick =
      ()=>useBattleSkill(skillId);

    container.appendChild(button);

  });

}


/* =========================================================
   スキルセット
========================================================= */

function renderEquip(){

  const container =
    document.getElementById("equipList");

  container.innerHTML = "";


  Object.entries(characters).forEach(([characterId,c])=>{

    const div =
      document.createElement("div");

    div.className = "character";


    let html = `
      <h3>${escapeHTML(c.name)}</h3>
    `;


    for(let slot=0;slot<3;slot++){

      const current =
        game.equippedSkills[characterId]?.[slot] || "";


      html += `
        <label>
          スロット${slot+1}
        </label>

        <select
          onchange="changeEquip(
            '${characterId}',
            ${slot},
            this.value
          )"
        >

          <option value="">なし</option>

          ${game.ownedSkills.map(skillId=>{

            const skill = skills[skillId];

            if(!skill){
              return "";
            }

            return `
              <option
                value="${skillId}"
                ${current === skillId ? "selected":""}
              >
                ${escapeHTML(skill.name)}
                [${skill.rarity}]
              </option>
            `;

          }).join("")}

        </select>
      `;

    }


    div.innerHTML = html;

    container.appendChild(div);

  });

}


function changeEquip(characterId,slot,value){

  if(!game.equippedSkills[characterId]){
    game.equippedSkills[characterId] = [];
  }


  const equipped =
    game.equippedSkills[characterId];


  /*
    同じスキルの重複装備を防ぐ
  */

  if(value){

    const existing =
      equipped.indexOf(value);

    if(existing !== -1 && existing !== slot){

      equipped[slot] = "";

      saveGame();

      renderEquip();

      toast("同じスキルは2個装備できません。");

      return;
    }

  }


  equipped[slot] = value;

  /*
    後ろの空スロットを整理
  */

  game.equippedSkills[characterId] =
    equipped.slice(0,3);


  saveGame();

  renderEquip();

}


/* =========================================================
   戦闘キャラ
========================================================= */

function renderBattleCharacters(){

  const container =
    document.getElementById("battleCharacterList");

  container.innerHTML = "";


  Object.entries(characters).forEach(([id,c])=>{

    const selected =
      game.selectedCharacter === id;


    const div =
      document.createElement("div");

    div.className = "character";


    div.innerHTML = `
      <h3>${escapeHTML(c.name)}</h3>

      <div class="stat">
        HP：${c.hp}<br>
        攻撃：${c.attack}<br>
        防御：${c.defense}
      </div>

      <button
        onclick="selectBattleCharacter('${id}')"
        ${selected ? "disabled":""}
      >
        ${selected ? "選択中" : "このキャラを選択"}
      </button>
    `;


    container.appendChild(div);

  });

}


function selectBattleCharacter(id){

  if(!characters[id]){
    return;
  }

  game.selectedCharacter = id;

  saveGame();

  renderBattleCharacters();

  toast(
    `${characters[id].name}を選択しました。`
  );

}


/* =========================================================
   設定
========================================================= */

function renderSettings(){

  document.getElementById("bgmState").textContent =
    game.bgm ? "ON" : "OFF";

}


function toggleBGM(){

  game.bgm = !game.bgm;

  saveGame();

  renderSettings();

  toast(
    `BGM：${game.bgm ? "ON" : "OFF"}`
  );

}


function deleteSave(){

  const ok =
    confirm(
      "本当にセーブデータを削除しますか？"
    );

  if(!ok){
    return;
  }

  try{
    localStorage.removeItem(STORAGE_KEY);
  }catch(error){
    console.warn(error);
  }

  game = createDefaultSave();

  updateTitleInfo();

  alert("セーブデータを削除しました。");

}


/* =========================================================
   タイトル情報
========================================================= */

function updateTitleInfo(){

  const elements = [
    document.getElementById("titleStones"),
    document.getElementById("gachaStones")
  ];


  elements.forEach(el=>{

    if(el){
      el.textContent = game.stones;
    }

  });

}


/* =========================================================
   トースト
========================================================= */

let toastTimer = null;


function toast(message){

  const element =
    document.getElementById("toast");

  element.textContent =
    message;

  element.style.display =
    "block";


  clearTimeout(toastTimer);


  toastTimer =
    setTimeout(()=>{

      element.style.display =
        "none";

    },1800);

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   起動
========================================================= */

loadGame();

updateTitleInfo();

</script>
